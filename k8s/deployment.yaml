apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calculator-deployment
  labels:
    app: grade-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-calculator
  template:
    metadata:
      labels:
        app: grade-calculator
    spec:
      containers:
        - name: grade-calc-container
          image: gok141006/grade-calculator-app:02c9f161ecf5ceec756d052db55ac0d0e8718ca8
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
